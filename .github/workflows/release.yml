# Push a tag like v0.2.0 (matching "version" in package.json) to build the app and publish it as
# a GitHub Release: one zip of the app folder (unzip once, run TLI Overlay.exe; it starts at once,
# unlike a single-file exe that unpacks itself on every launch).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem release/*.zip).FullName --title "${{ github.ref_name }}" --generate-notes
